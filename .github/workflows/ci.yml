name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, type-check, build, spoiler test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Spoiler lint and chapter bundles
        run: npm run data

      - name: Type-check
        run: npx tsc --noEmit
      - name: Worker unit tests
        run: npm run test:worker

      - name: Build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Rendered-page spoiler test
        timeout-minutes: 30
        run: |
          npx vite preview --port 4317 --strictPort > preview.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS -o /dev/null http://localhost:4317/; then break; fi
            if [ "$i" = 60 ]; then echo "preview server did not start"; cat preview.log; exit 1; fi
            sleep 1
          done
          npm run test:spoilers

name: Full spoiler test

# The rendered-page spoiler test across every chapter (about ten minutes).
# CI runs a sample of chapters on each push; this covers the rest.
on:
  pull_request:
  schedule:
    - cron: '17 9 * * *' # nightly
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spoilers-full-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spoilers:
    name: Rendered-page spoiler test (all chapters)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Rendered-page spoiler test
        timeout-minutes: 25
        run: |
          npx vite preview --port 4317 --strictPort > preview.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS -o /dev/null http://localhost:4317/; then break; fi
            if [ "$i" = 60 ]; then echo "preview server did not start"; cat preview.log; exit 1; fi
            sleep 1
          done
          npm run test:spoilers
